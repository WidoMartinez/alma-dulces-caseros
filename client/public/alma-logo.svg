<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Logo alternativo: alma-logo.svg para mantener compatibilidad -->
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB5E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9EC9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA07A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="95" fill="url(#mainGrad)"/>
  
  <!-- Corazón -->
  <g transform="translate(100, 85)">
    <path d="M 0,15 C -5,5 -15,0 -25,5 C -35,10 -35,25 -25,35 L 0,55 L 25,35 C 35,25 35,10 25,5 C 15,0 5,5 0,15 Z"
          fill="white" opacity="0.9"/>
  </g>
  
  <!-- Ondas decorativas -->
  <g transform="translate(100, 40)" opacity="0.7">
    <path d="M -15,0 Q -15,-8 -10,-10 T -5,-8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 Q 0,-10 5,-12 T 10,-10" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 15,0 Q 15,-8 20,-10 T 25,-8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Texto -->
  <text x="100" y="165" font-family="'Georgia', serif" font-size="36" font-weight="600"
        fill="white" text-anchor="middle" letter-spacing="2">Alma</text>
  
  <!-- Líneas decorativas -->
  <line x1="60" y1="175" x2="85" y2="175" stroke="white" stroke-width="1.5" opacity="0.9"/>
  <line x1="115" y1="175" x2="140" y2="175" stroke="white" stroke-width="1.5" opacity="0.9"/>
</svg>
