<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!-- Imagen hero principal - Dulces artesanales -->
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4E1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA07A;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="600" height="600" fill="url(#heroGrad1)"/>
  
  <!-- Elementos decorativos de fondo -->
  <circle cx="100" cy="100" r="60" fill="#FFB5E8" opacity="0.1"/>
  <circle cx="500" cy="150" r="80" fill="#FFA07A" opacity="0.1"/>
  <circle cx="150" cy="500" r="70" fill="#FFD4E5" opacity="0.1"/>
  <circle cx="480" cy="480" r="90" fill="#FFB5E8" opacity="0.1"/>
  
  <!-- Plato principal -->
  <g transform="translate(300, 300)">
    <!-- Plato -->
    <ellipse cx="0" cy="80" rx="180" ry="25" fill="#E0C8B8" opacity="0.4"/>
    <ellipse cx="0" cy="75" rx="170" ry="20" fill="#F5E6D3"/>
    
    <!-- Tarta principal - 3 capas -->
    <!-- Capa inferior -->
    <g filter="url(#softShadow)">
      <ellipse cx="0" cy="40" rx="140" ry="20" fill="#8B7355"/>
      <path d="M -140,40 L -140,10 Q -140,-10 -100,-15 L 100,-15 Q 140,-10 140,10 L 140,40 Z" 
            fill="url(#heroGrad2)"/>
      <ellipse cx="0" cy="10" rx="140" ry="20" fill="#FFB5E8"/>
    </g>
    
    <!-- Capa media -->
    <g filter="url(#softShadow)">
      <ellipse cx="0" cy="-10" rx="110" ry="16" fill="#7A6147"/>
      <path d="M -110,-10 L -110,-35 Q -110,-50 -80,-53 L 80,-53 Q 110,-50 110,-35 L 110,-10 Z" 
            fill="#FFD4B8"/>
      <ellipse cx="0" cy="-35" rx="110" ry="16" fill="#FFE4C4"/>
    </g>
    
    <!-- Capa superior -->
    <g filter="url(#softShadow)">
      <ellipse cx="0" cy="-55" rx="80" ry="12" fill="#6B5340"/>
      <path d="M -80,-55 L -80,-75 Q -80,-85 -60,-87 L 60,-87 Q 80,-85 80,-75 L 80,-55 Z" 
            fill="#FFA07A"/>
      <ellipse cx="0" cy="-75" rx="80" ry="12" fill="#FFB88C"/>
    </g>
    
    <!-- Decoración de glaseado -->
    <path d="M -70,-85 Q -50,-92 -30,-85 T 10,-85 T 50,-85 T 70,-85" 
          stroke="#FFE4E1" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Fresas decorativas -->
    <g transform="translate(-40, -95)">
      <path d="M 0,0 L -8,12 L 8,12 Z" fill="#FF6B8A"/>
      <circle cx="0" cy="3" r="3" fill="#90EE90"/>
      <path d="M -2,1 L 0,-5" stroke="#4A7C59" stroke-width="1.5"/>
    </g>
    
    <g transform="translate(20, -98)">
      <path d="M 0,0 L -7,10 L 7,10 Z" fill="#FF6B8A"/>
      <circle cx="0" cy="2" r="2.5" fill="#90EE90"/>
      <path d="M -1.5,0.5 L 0,-4" stroke="#4A7C59" stroke-width="1.5"/>
    </g>
    
    <g transform="translate(45, -93)">
      <path d="M 0,0 L -6,10 L 6,10 Z" fill="#FF6B8A"/>
      <circle cx="0" cy="2" r="2.5" fill="#90EE90"/>
      <path d="M -1.5,0.5 L 0,-4" stroke="#4A7C59" stroke-width="1.5"/>
    </g>
    
    <!-- Flores decorativas alrededor -->
    <g transform="translate(-160, -20)">
      <circle cx="0" cy="0" r="8" fill="#FFB5E8"/>
      <circle cx="-8" cy="0" r="6" fill="#FFC4DD"/>
      <circle cx="8" cy="0" r="6" fill="#FFC4DD"/>
      <circle cx="0" cy="-8" r="6" fill="#FFC4DD"/>
      <circle cx="0" cy="8" r="6" fill="#FFC4DD"/>
      <circle cx="0" cy="0" r="4" fill="#FFE4B5"/>
    </g>
    
    <g transform="translate(170, 10)">
      <circle cx="0" cy="0" r="7" fill="#FFA07A"/>
      <circle cx="-7" cy="0" r="5" fill="#FFB88C"/>
      <circle cx="7" cy="0" r="5" fill="#FFB88C"/>
      <circle cx="0" cy="-7" r="5" fill="#FFB88C"/>
      <circle cx="0" cy="7" r="5" fill="#FFB88C"/>
      <circle cx="0" cy="0" r="3" fill="#FFDB99"/>
    </g>
  </g>
  
  <!-- Texto decorativo -->
  <text x="300" y="550" font-family="'Georgia', serif" font-size="24" 
        fill="#8B7355" text-anchor="middle" font-weight="600" opacity="0.7">
    Alma · Dulces Artesanales
  </text>
</svg>
