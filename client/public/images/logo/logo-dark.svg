<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Versión del logo para fondos oscuros -->
  <defs>
    <linearGradient id="logoDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD9EC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFC4DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB8A0;stop-opacity:1" />
    </linearGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="95" fill="url(#logoDarkGrad)" filter="url(#glowEffect)"/>
  
  <!-- Forma de corazón -->
  <g transform="translate(100, 85)">
    <path d="M 0,15 
             C -5,5 -15,0 -25,5
             C -35,10 -35,25 -25,35
             L 0,55
             L 25,35
             C 35,25 35,10 25,5
             C 15,0 5,5 0,15 Z"
          fill="#4A4A4A" opacity="0.85"/>
  </g>
  
  <!-- Decoración de ondas -->
  <g transform="translate(100, 40)" opacity="0.8">
    <path d="M -15,0 Q -15,-8 -10,-10 T -5,-8" 
          stroke="#4A4A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 Q 0,-10 5,-12 T 10,-10" 
          stroke="#4A4A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 15,0 Q 15,-8 20,-10 T 25,-8" 
          stroke="#4A4A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Texto "Alma" -->
  <text x="100" y="165" 
        font-family="'Georgia', 'Palatino', serif" 
        font-size="36" 
        font-weight="600"
        fill="#4A4A4A" 
        text-anchor="middle"
        letter-spacing="2">
    Alma
  </text>
  
  <!-- Subtexto decorativo -->
  <g opacity="0.8">
    <line x1="60" y1="175" x2="85" y2="175" stroke="#4A4A4A" stroke-width="1.5"/>
    <line x1="115" y1="175" x2="140" y2="175" stroke="#4A4A4A" stroke-width="1.5"/>
  </g>
</svg>
