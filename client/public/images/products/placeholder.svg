<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Fondo con gradiente suave -->
  <rect width="400" height="400" fill="#FDF6F0"/>
  <rect width="400" height="400" fill="url(#grad1)" opacity="0.3"/>
  
  <!-- Definir gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA07A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ícono de dulce/pastel -->
  <g transform="translate(200, 200)">
    <!-- Base del pastel -->
    <ellipse cx="0" cy="30" rx="80" ry="15" fill="#E8C4A8" opacity="0.5"/>
    
    <!-- Cuerpo del pastel -->
    <rect x="-70" y="-40" width="140" height="70" rx="10" fill="#F4D4BA"/>
    <rect x="-60" y="-70" width="120" height="30" rx="8" fill="#FFE4D1"/>
    
    <!-- Decoración de glaseado -->
    <path d="M -60,-40 Q -40,-50 -20,-40 T 20,-40 T 60,-40" 
          fill="none" stroke="#FFB5D4" stroke-width="6" stroke-linecap="round"/>
    <path d="M -50,-45 Q -30,-55 -10,-45 T 30,-45 T 50,-45" 
          fill="none" stroke="#FFA8D8" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Cereza en el centro -->
    <circle cx="0" cy="-75" r="10" fill="#FF6B9D"/>
    <path d="M 0,-75 Q -5,-85 -3,-95" stroke="#8B4513" stroke-width="2" fill="none"/>
    
    <!-- Puntos decorativos -->
    <circle cx="-40" cy="-10" r="4" fill="#FFB5D4"/>
    <circle cx="-20" cy="0" r="4" fill="#FFB5D4"/>
    <circle cx="0" cy="-5" r="4" fill="#FFB5D4"/>
    <circle cx="20" cy="0" r="4" fill="#FFB5D4"/>
    <circle cx="40" cy="-10" r="4" fill="#FFB5D4"/>
  </g>
  
  <!-- Texto placeholder -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="18" 
        fill="#A0A0A0" text-anchor="middle" font-weight="600">
    Sin imagen
  </text>
</svg>
